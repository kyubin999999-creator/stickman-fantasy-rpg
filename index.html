<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>졸라맨 원소 RPG</title>
    <style>
        body {
            margin: 0;
            background-color: #0d0f12;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 255, 200, 0.2);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #2a324d;
        }
        canvas {
            background: #000;
            display: block;
        }
        #uiOverlay {
            position: absolute;
            top: 15px;
            left: 15px;
            pointer-events: none;
            background: rgba(15, 20, 30, 0.85);
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid #3d4b75;
            font-size: 13px;
            line-height: 1.6;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .stat-val { color: #00ffcc; font-weight: bold; }
        .controls {
            margin-top: 12px;
            color: #8a99ad;
            font-size: 13px;
            background: #161b26;
            padding: 8px 16px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="900" height="500"></canvas>
    <div id="uiOverlay">
        <div><strong>👑 등급:</strong> <span id="rankText" class="stat-val">1등급 (x1.0)</span></div>
        <div><strong>❤️ HP:</strong> <span id="hpText" class="stat-val">100/100</span> | <strong>⚡ EN:</strong> <span id="enText" class="stat-val">50/50</span></div>
        <div><strong>⚔️ 출력:</strong> <span id="atkText" class="stat-val">10</span> | <strong>🔮 제어력:</strong> <span id="ctrlText" class="stat-val">5</span></div>
        <div><strong>🔥 속성:</strong> <span id="elemText" class="stat-val">원초 (없음)</span></div>
    </div>
</div>
<div class="controls">
    🎮 조작법: [← / →] 이동 | [Space] 점프 | [Z] 검격 공격 | [X] 원소 파동 스킬
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- 플레이어 설정 ---
const player = {
    x: 100, y: 300, width: 24, height: 48,
    vx: 0, vy: 0,
    isGrounded: false,
    facing: 'right',
    
    rank: 1,
    baseHp: 100, baseEn: 50, baseAtk: 15, baseControl: 5,
    element: '불',
    kills: 0,
    
    isAttacking: false, attackTimer: 0,
    isSkill: false, skillTimer: 0
};

const RANK_MULT = { 1: 1.0, 2: 2.5, 3: 10.0, 4: 50.0, 5: 1000.0 };

// --- 메이플 스타일 입체 지형 ---
const platforms = [
    { x: 0, y: 440, width: 900, height: 60 },      // 메인 바닥
    { x: 80, y: 340, width: 220, height: 16 },    // 1층 좌측
    { x: 600, y: 340, width: 220, height: 16 },   // 1층 우측
    { x: 330, y: 250, width: 240, height: 16 },   // 2층 중앙
    { x: 120, y: 160, width: 180, height: 16 }    // 3층 꼭대기
];

// --- 몬스터 & 파티클 시스템 ---
let monsters = [
    { x: 200, y: 300, width: 30, height: 26, hp: 40, maxHp: 40, vx: 1, type: '슬라임' },
    { x: 400, y: 200, width: 35, height: 35, hp: 80, maxHp: 80, vx: -1.5, type: '마수' },
    { x: 680, y: 300, width: 30, height: 26, hp: 40, maxHp: 40, vx: 1, type: '슬라임' }
];

let particles = [];
let damageTexts = [];

// 키 입력
const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

// --- 데미지 텍스트 팝업 ---
function addDamageText(x, y, damage, color = '#ffeb3b') {
    damageTexts.push({ x, y, text: Math.floor(damage), opacity: 1, vy: -2, color });
}

// --- 공격 hit 판정 ---
function attackHit(range, isSkill = false) {
    const mult = RANK_MULT[player.rank];
    const dmg = (isSkill ? player.baseAtk * 2.5 : player.baseAtk) * mult;

    const hitBox = {
        x: player.facing === 'right' ? player.x + player.width : player.x - range,
        y: player.y - 10,
        width: range,
        height: player.height + 20
    };

    monsters.forEach((m, idx) => {
        if (hitBox.x < m.x + m.width && hitBox.x + hitBox.width > m.x &&
            hitBox.y < m.y + m.height && hitBox.y + hitBox.height > m.y) {
            
            m.hp -= dmg;
            addDamageText(m.x + 10, m.y - 10, dmg, isSkill ? '#ff4d4d' : '#ffffff');
            
            // 이펙트 파티클
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: m.x + m.width/2, y: m.y + m.height/2,
                    vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
                    life: 15, color: isSkill ? '#ff6b35' : '#00e5ff'
                });
            }

            if (m.hp <= 0) {
                monsters.splice(idx, 1);
                player.kills++;
                player.baseAtk += 3;
                if (player.kills >= 3 && player.rank === 1) player.rank = 2;

                // 리젠
                setTimeout(() => {
                    const spawnX = Math.random() * 700 + 100;
                    monsters.push({ x: spawnX, y: 100, width: 30, height: 26, hp: 50 * mult, maxHp: 50 * mult, vx: 1, type: '슬라임' });
                }, 2500);
            }
        }
    });
}

// --- 메인 업데이트 루프 ---
function update() {
    const mult = RANK_MULT[player.rank];
    const speed = 4.5;

    if (keys['ArrowLeft']) { player.vx = -speed; player.facing = 'left'; }
    else if (keys['ArrowRight']) { player.vx = speed; player.facing = 'right'; }
    else { player.vx = 0; }

    if ((keys['Space'] || keys[' ']) && player.isGrounded) {
        player.vy = -11;
        player.isGrounded = false;
    }

    // Z: 일반 공격
    if ((keys['z'] || keys['Z']) && !player.isAttacking && !player.isSkill) {
        player.isAttacking = true;
        player.attackTimer = 12;
        attackHit(50, false);
    }
    if (player.attackTimer > 0) player.attackTimer--;
    else player.isAttacking = false;

    // X: 원소 스킬
    if ((keys['x'] || keys['X']) && !player.isSkill && !player.isAttacking) {
        player.isSkill = true;
        player.skillTimer = 20;
        attackHit(90, true);
    }
    if (player.skillTimer > 0) player.skillTimer--;
    else player.isSkill = false;

    // 중력 및 이동
    player.vy += 0.55;
    player.x += player.vx;
    player.y += player.vy;

    // 발판 충돌
    player.isGrounded = false;
    platforms.forEach(plat => {
        if (player.x < plat.x + plat.width &&
            player.x + player.width > plat.x &&
            player.y + player.height >= plat.y &&
            player.y + player.height <= plat.y + 16 &&
            player.vy >= 0) {
            
            player.y = plat.y - player.height;
            player.vy = 0;
            player.isGrounded = true;
        }
    });

    if (player.x < 0) player.x = 0;
    if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;

    // 몬스터 AI (발판 왕복)
    monsters.forEach(m => {
        m.x += m.vx;
        if (m.x < 50 || m.x > 820) m.vx *= -1;
    });

    // 파티클 & 텍스트 업데이트
    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    });

    damageTexts.forEach((d, i) => {
        d.y += d.vy; d.opacity -= 0.03;
        if (d.opacity <= 0) damageTexts.splice(i, 1);
    });

    // UI 갱신
    document.getElementById('rankText').innerText = `${player.rank}등급 (x${mult})`;
    document.getElementById('hpText').innerText = `${Math.floor(player.baseHp * mult)}/${Math.floor(player.baseHp * mult)}`;
    document.getElementById('enText').innerText = `${Math.floor(player.baseEn * mult)}/${Math.floor(player.baseEn * mult)}`;
    document.getElementById('atkText').innerText = `${Math.floor(player.baseAtk * mult)}`;
    document.getElementById('ctrlText').innerText = `${Math.floor(player.baseControl * mult)}`;
    document.getElementById('elemText').innerText = player.element;
}

// --- 렌더링 (그리기) ---
function draw() {
    // 배경 (고대 유적 감성)
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, '#0a0d14');
    grad.addColorStop(1, '#182033');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 발판 그리기 (입체감)
    platforms.forEach(plat => {
        ctx.fillStyle = '#2d3748';
        ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
        ctx.fillStyle = '#4a5568';
        ctx.fillRect(plat.x, plat.y, plat.width, 4); // 상단 테두리
    });

    // 몬스터 그리기
    monsters.forEach(m => {
        ctx.fillStyle = m.type === '슬라임' ? '#38a169' : '#e53e3e';
        ctx.beginPath();
        ctx.arc(m.x + m.width/2, m.y + m.height/2, m.width/2, 0, Math.PI * 2);
        ctx.fill();

        // 체력바
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(m.x, m.y - 10, m.width, 5);
        ctx.fillStyle = '#48bb78';
        ctx.fillRect(m.x, m.y - 10, (m.hp / m.maxHp) * m.width, 5);
    });

    // 파티클
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 4, 4);
    });

    // 졸라맨(플레이어) 그리기
    const px = player.x + player.width / 2;
    const py = player.y;
    const mult = RANK_MULT[player.rank];

    // 등급 오라 이펙트
    if (player.rank >= 2) {
        ctx.strokeStyle = `rgba(255, 170, 0, ${0.3 + Math.sin(Date.now() / 200) * 0.2})`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(px, py + 20, 30, 0, Math.PI * 2);
        ctx.stroke();
    }

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;

    // 머리
    ctx.beginPath(); ctx.arc(px, py + 10, 8, 0, Math.PI * 2); ctx.stroke();
    // 몸통
    ctx.beginPath(); ctx.moveTo(px, py + 18); ctx.lineTo(px, py + 34); ctx.stroke();
    // 다리
    ctx.beginPath(); ctx.moveTo(px, py + 34); ctx.lineTo(px - 8, py + 48); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px, py + 34); ctx.lineTo(px + 8, py + 48); ctx.stroke();

    // 팔 & 공격 이펙트
    ctx.beginPath(); ctx.moveTo(px, py + 22);
    if (player.isAttacking) {
        const dir = player.facing === 'right' ? 1 : -1;
        ctx.lineTo(px + (24 * dir), py + 18); ctx.stroke();

        // 검격 잔상 이펙트
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(px, py + 20, 35, player.facing === 'right' ? -0.8 : 2.2, player.facing === 'right' ? 0.8 : 4.0);
        ctx.stroke();
    } else if (player.isSkill) {
        // X 스킬 (화염 파동)
        const dir = player.facing === 'right' ? 1 : -1;
        ctx.lineTo(px + (15 * dir), py + 10); ctx.stroke();

        ctx.fillStyle = '#ff5722';
        ctx.beginPath();
        ctx.arc(px + (50 * dir), py + 20, 25, 0, Math.PI * 2);
        ctx.fill();
    } else {
        ctx.lineTo(px - 8, py + 28); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px, py + 22); ctx.lineTo(px + 8, py + 28); ctx.stroke();
    }

    // 데미지 텍스트
    damageTexts.forEach(d => {
        ctx.fillStyle = d.color;
        ctx.font = 'bold 16px sans-serif';
        ctx.globalAlpha = d.opacity;
        ctx.fillText(d.text, d.x, d.y);
        ctx.globalAlpha = 1.0;
    });
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
